<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isabel Variedades - Leitor de Câmera</title>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    
    <!-- Biblioteca ZXing para Leitura de Código de Barras via Câmera -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>

    <!-- Folha de Estilos Exclusiva -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO SUPERIOR -->
    <header class="scanner-header">
        <div class="scanner-brand">
            <i class="fa-solid fa-barcode"></i>
            <span>Isabel Variedades</span>
        </div>
        <div id="scanner-status" class="status-badge">Iniciando...</div>
    </header>

    <!-- ÁREA CENTRAL DE CAPTURA DA CÂMERA -->
    <main class="scanner-container">
        <!-- Elemento de vídeo onde a câmera será renderizada -->
        <video id="video-preview" autoplay playsinline muted></video>

        <!-- MOLDURA DE FOCO E JOGO DE LUZ (LASER ANIMADO) -->
        <div class="scanner-overlay">
            <div class="target-frame">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
                <div class="laser-beam"></div>
            </div>
            <p class="guide-label">Aponte para o código de barras</p>
        </div>

        <!-- TELA DE SUCESSO / RESULTADO (CONGELADO APÓS A LEITURA) -->
        <div id="result-card" class="result-card hidden">
            <div class="success-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <span class="result-subtitle">Código Capturado com Sucesso</span>
            <div id="scanned-code-display" class="result-code font-mono">---</div>
            <div id="scanned-product-info" class="result-product-name">Buscando produto...</div>

            <button onclick="restartScanner()" class="btn-rescan">
                <i class="fa-solid fa-rotate-right"></i> Escanear Novo Item
            </button>
        </div>

        <!-- MENSAGEM DE ERRO DE PERMISSÃO / CÂMERA -->
        <div id="error-card" class="error-card hidden">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <h3>Erro ao Acessar Câmera</h3>
            <p id="error-msg">Permita o uso da câmera nas configurações do seu navegador.</p>
            <button onclick="location.reload()" class="btn-retry">Tentar Novamente</button>
        </div>
    </main>

    <!-- RODAPÉ -->
    <footer class="scanner-footer">
        <span class="footer-info"><i class="fa-solid fa-bolt"></i> Sincronizado em tempo real com o PDV</span>
    </footer>

    <!-- Lógica do Leitor -->
    <script src="script.js"></script>
</body>
</html>
