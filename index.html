<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-900 text-slate-100">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isabel Variedades - Frente de Caixa (PDV)</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>

<body class="h-full flex flex-col bg-slate-950 text-slate-100">

    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
        <h1 class="font-bold text-lg text-white">Isabel Variedades <span class="text-brand-500">PDV</span></h1>
        <a href="leitor.html" target="_blank" class="bg-brand-600/20 text-brand-400 border border-brand-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold hover:bg-brand-600/30 transition flex items-center gap-1.5">
            <i class="fa-solid fa-mobile-screen"></i> Abrir Leitor Celular
        </a>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-12 gap-4">
        <div class="md:col-span-8 bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col shadow-xl">
            <h2 class="font-bold text-sm text-slate-300 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-basket-shopping text-brand-500"></i> Carrinho Sincronizado em Tempo Real
            </h2>
            <div class="flex-1 overflow-y-auto max-h-[60vh]">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="text-xs text-slate-400 border-b border-slate-800">
                            <th class="py-2">Produto</th>
                            <th class="py-2 text-right">Qtd</th>
                            <th class="py-2 text-right">Unitário</th>
                            <th class="py-2 text-right">Total</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items-tbody" class="divide-y divide-slate-800/40"></tbody>
                </table>
                <div id="cart-empty" class="text-center py-12 text-slate-500 text-xs">
                    Aguardando itens... Bipe no celular ou digite no leitor.
                </div>
            </div>
        </div>

        <div class="md:col-span-4 bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between shadow-xl">
            <div>
                <h3 class="text-xs font-bold uppercase text-slate-400 tracking-wider mb-3">Resumo</h3>
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-center">
                    <span class="text-xs text-brand-500 font-bold uppercase">Total</span>
                    <div id="summary-total" class="text-3xl font-black text-white mt-1 font-mono-num">R$ 0,00</div>
                </div>
            </div>
            <button onclick="alert('Venda finalizada!')" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-brand-600/30">
                Finalizar Venda (F2)
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
