<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isabel Variedades - Leitor Mobile</title>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    
    <!-- Biblioteca ZXing para Leitura de Código de Barras -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>

    <!-- Firebase SDK (Compat v9) para Sincronização em Nuvem -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- Estilos do Leitor -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="scanner-header">
        <div class="scanner-brand">
            <i class="fa-solid fa-barcode"></i>
            <span>Isabel Variedades</span>
        </div>
        <div id="scanner-status" class="status-badge">Conectando Nuvem...</div>
    </header>

    <main class="scanner-container">
        <video id="video-preview" autoplay playsinline muted></video>

        <div class="scanner-overlay">
            <div class="target-frame">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
                <div class="laser-beam"></div>
            </div>
            <p class="guide-label">Aponte para o código de barras</p>
        </div>

        <div id="result-card" class="result-card hidden">
            <div class="success-icon"><i class="fa-solid fa-circle-check"></i></div>
            <span class="result-subtitle">Enviado ao PDV na Nuvem</span>
            <div id="scanned-code-display" class="result-code font-mono">---</div>
            <div id="scanned-product-info" class="result-product-name">Processando...</div>

            <button onclick="restartScanner()" class="btn-rescan">
                <i class="fa-solid fa-rotate-right"></i> Escanear Novo Item
            </button>
        </div>

        <div id="error-card" class="error-card hidden">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <h3>Erro na Câmera</h3>
            <p id="error-msg">Permita o uso da câmera nas configurações.</p>
            <button onclick="location.reload()" class="btn-retry">Tentar Novamente</button>
        </div>
    </main>

    <footer class="scanner-footer">
        <span class="footer-info"><i class="fa-solid fa-cloud"></i> Sincronizado via Firebase Realtime Database</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
