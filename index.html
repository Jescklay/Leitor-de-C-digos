<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isabel Variedades - Leitor Mobile</title>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    
    <!-- Html5-Qrcode Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- Folha de Estilos Exclusiva do Leitor -->
    <link rel="stylesheet" href="leitor.css">
</head>
<body>

    <!-- CABEÇALHO SUPERIOR FLUTUANTE -->
    <header class="scanner-header">
        <div class="scanner-brand">
            <i class="fa-solid fa-camera"></i>
            <span>Leitor Mobile</span>
        </div>
        <div id="scanner-status" class="scanner-status-pill">Iniciando câmera...</div>
    </header>

    <!-- ÁREA DA CÂMERA E MIRA CENTRALIZADA -->
    <main class="scanner-main">
        <!-- O container onde a biblioteca injeta o vídeo -->
        <div id="reader"></div>

        <!-- MIRA / GUIA DE LEITURA CENTRALIZADA -->
        <div class="scanner-overlay-guide">
            <div class="scanner-target-box">
                <div class="scanner-target-corner top-left"></div>
                <div class="scanner-target-corner top-right"></div>
                <div class="scanner-target-corner bottom-left"></div>
                <div class="scanner-target-corner bottom-right"></div>
                <div class="scanner-laser-line"></div>
            </div>
            <p class="scanner-guide-text">Posicione o código de barras no interior da mira</p>
        </div>

        <!-- MENSAGEM DE ERRO DE PERMISSÃO / CÂMERA -->
        <div id="scanner-error-container" class="scanner-error-box hidden">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <h3 id="error-title">Erro na Câmera</h3>
            <p id="error-message">Não foi possível acessar a câmera do dispositivo.</p>
            <button onclick="location.reload()" class="scanner-retry-btn">Tentar Novamente</button>
        </div>

        <!-- CARD FLUTUANTE DE FEEDBACK DO PRODUTO LIDOR -->
        <div id="feedback-card" class="scanner-feedback-card hidden">
            <div class="feedback-badge">
                <i class="fa-solid fa-circle-check"></i> Adicionado ao Carrinho
            </div>
            <div id="fb-product-name" class="feedback-name">-</div>
            <div class="feedback-details">
                <span id="fb-product-code" class="feedback-code">-</span>
                <span id="fb-product-price" class="feedback-price">R$ 0,00</span>
            </div>
        </div>
    </main>

    <!-- RODAPÉ DE NAVEGAÇÃO -->
    <footer class="scanner-footer">
        <a href="index.html" class="scanner-back-btn">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao PDV Principal
        </a>
    </footer>

    <!-- Lógica JavaScript do Leitor -->
    <script src="leitor.js"></script>
</body>
</html>
